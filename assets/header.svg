<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Antônio Corte Real — Full-stack &amp; ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0e1b2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="236" rx="15" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>

  <!-- floating code glyphs -->
  <g font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#3FB950" opacity="0.5">
    <text x="690" y="60">&lt;/&gt;</text>
    <text x="778" y="120">{ }</text>
    <text x="708" y="186">def()</text>
    <text x="822" y="80">01</text>
  </g>
  <g opacity="0.5">
    <circle cx="660" cy="150" r="3" fill="#58A6FF">
      <animate attributeName="cy" values="150;130;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="160" r="3" fill="#3FB950">
      <animate attributeName="cy" values="160;140;160" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="55" r="2.5" fill="#58A6FF">
      <animate attributeName="cy" values="55;42;55" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- animated accent bar -->
  <rect x="50" y="64" width="6" height="112" rx="3" fill="url(#accent)">
    <animate attributeName="height" values="112;90;112" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="64;75;64" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="78" y="92" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#e6edf3">Antônio C. Corte Real</text>

  <!-- role line -->
  <text x="80" y="128" font-family="'Fira Code','Consolas',monospace" font-size="19" font-weight="500" fill="#58A6FF">&gt; full-stack &#183; ML engineer</text>
  <rect x="376" y="114" width="9" height="18" fill="#3FB950">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- meta lines -->
  <text x="80" y="158" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="15" fill="#8b949e">React · Next.js · Node · Python · C++ · GPU</text>
  <text x="80" y="182" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="15" fill="#8b949e">Brasília–DF, Brasil  ·  EN/PT  ·  open to collaborations</text>
</svg>
